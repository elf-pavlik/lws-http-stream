# Schema for IDEA:
# $schema: https://schema.golem.cloud/app/golem/1.6.0/golem.schema.json
# Schema for vscode-yaml:
# yaml-language-server: $schema=https://schema.golem.cloud/app/golem/1.6.0/golem.schema.json

manifestVersion: 1.6.0

app: lws-http-stream

version:
  git:
    tagPattern: "v*"
    hashFallback: true
    staticFallback: "v0.0.0"

environments:
  local:
    server: local
    componentPresets: debug
    version:
      git:
        allowDirty: true
  cloud:
    server: cloud
    componentPresets: release
    deployment:
      versionCheck: true

# The local Node server also listens on 8787, so run only one of them at a time.
localServer:
  customRequestPort: 8787

components:
  lws-http-stream:rust-main:
    dir: "rust"
    templates: rust

httpApi:
  deployments:
    local:
      # Main server used by the UI: Rust NDJSON, CBOR-LD, and Jelly-RDF.
      - domain: 127.0.0.1:8787
        scheme: http
        agents:
          LwsRouter: {}
